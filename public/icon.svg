<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132A1E" />
      <stop offset="100%" stop-color="#1F4733" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D17A" />
      <stop offset="50%" stop-color="#D4A94C" />
      <stop offset="100%" stop-color="#9C7729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#primaryGrad)" />
  <rect x="4" y="4" width="92" height="92" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" />

  <!-- Restaurant Cloche & Wave Mark -->
  <g transform="translate(18, 20)">
    <!-- Cloche Handle Top -->
    <circle cx="32" cy="10" r="4.5" fill="url(#goldGrad)" />
    
    <!-- Cloche Dome -->
    <path d="M 10 32 C 10 18, 20 13, 32 13 C 44 13, 54 18, 54 32 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Cloche Base Tray -->
    <path d="M 6 36 L 58 36" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Modern Digital Signal / Pulse Rays -->
    <path d="M 22 46 C 28 42, 36 42, 42 46" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.9" />
    <path d="M 16 52 C 26 47, 38 47, 48 52" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="3" 
          stroke-linecap="round" />
  </g>
</svg>
